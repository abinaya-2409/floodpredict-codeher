<svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" viewBox="0 0 30 30">
  <!--
    The clickable variant: the same leaf, lifted and tilted as though caught
    by the wind, with a warmer blade. The shape change carries the state as
    well as the colour does, so it still reads without colour vision.
  -->
  <defs>
    <linearGradient id="blade2" x1="5" y1="4" x2="24" y2="25" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFC464"/>
      <stop offset="0.45" stop-color="#EE8A2E"/>
      <stop offset="1" stop-color="#B5521D"/>
    </linearGradient>
    <filter id="lift2" x="-30%" y="-30%" width="170%" height="170%">
      <feDropShadow dx="0.6" dy="1.2" stdDeviation="1" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <g filter="url(#lift2)" transform="rotate(-12 4 4)">
    <path
      d="M4 4 C 14 5.5, 22.5 11, 24 22 C 14.5 22.5, 6.5 16.5, 4 4 Z"
      fill="url(#blade2)"
      stroke="#6B2A12"
      stroke-width="1.1"
      stroke-linejoin="round"
    />
    <path d="M4.6 4.6 C 11 10, 17 16, 23.4 21.6" stroke="#6B2A12" stroke-width="1" stroke-linecap="round" fill="none" opacity="0.75"/>
    <path d="M8.6 8.6 L 8.2 13.4 M12.6 12.6 L 11.8 17.6 M16.6 16.6 L 16.2 20.8" stroke="#6B2A12" stroke-width="0.75" stroke-linecap="round" fill="none" opacity="0.5"/>
    <path d="M8.6 8.6 L 13.6 8.4 M12.6 12.6 L 17.8 12.6 M16.6 16.6 L 20.8 16.8" stroke="#6B2A12" stroke-width="0.75" stroke-linecap="round" fill="none" opacity="0.5"/>
    <path d="M24 22 C 25.4 23.4, 26.2 24.6, 26.4 26.2" stroke="#6B2A12" stroke-width="1.6" stroke-linecap="round" fill="none"/>
  </g>
</svg>
