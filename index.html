<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>FloodyLink - Urban Flood Intelligence</title>
    <meta
      name="description"
      content="Composite vulnerability risk index, street-level inundation forecasting and tiered early warning for flood-prone Indian wards."
    />
    <meta name="theme-color" content="#000000" />

    <!-- Theme, resolved before the first pixel.
         React only learns the theme once App mounts, which is several hundred
         milliseconds after the browser has already painted the loading screen.
         That gap showed as a white flash on the way into the OLED theme and a
         black one on the way into light. Setting the attribute here, ahead of
         the stylesheet, means the splash is already the right colour. -->
    <script>
      (function () {
        var mode = 'oled';
        try {
          var saved = localStorage.getItem('floodypredict_theme');
          if (saved === 'light' || saved === 'oled') mode = saved;
          else if (window.matchMedia('(prefers-color-scheme: light)').matches) mode = 'light';
        } catch (e) {}
        document.documentElement.dataset.theme = mode;
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', mode === 'light' ? '#eef4fa' : '#000000');
      })();
    </script>

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- iPhone reads none of the manifest. Installing to the home screen,
         the icon it uses, the title under it and the status bar colour are
         all controlled by these four tags and nothing else. -->
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="FloodyPredict" />
    <meta name="mobile-web-app-capable" content="yes" />

    <meta property="og:title" content="FloodyLink - Urban Flood Intelligence" />
    <meta
      property="og:description"
      content="Composite vulnerability risk index, street-level inundation forecasting and tiered early warning for flood-prone Indian wards."
    />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/og-cover.svg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="/og-cover.svg" />

    <!-- Tile and geocoding hosts: warms DNS + TLS before Leaflet asks for
         the first tile, which is the largest single chunk of map latency. -->
    <link rel="preconnect" href="https://server.arcgisonline.com" crossorigin />
    <link rel="dns-prefetch" href="https://nominatim.openstreetmap.org" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      FloodyLink needs JavaScript to render live flood modelling. For emergency
      assistance in India call 1070 (State) or 1913 (Chennai Corporation).
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
